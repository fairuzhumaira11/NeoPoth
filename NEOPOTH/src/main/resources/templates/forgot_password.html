<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NeoPoth</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neoRed: '#DC2626',
                        neoRedHover: '#B91C1C',
                        neoDark: '#1F2937',
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <div class="mx-auto w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mb-4">
                <i class="fas fa-key text-2xl text-neoRed"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Forgot Password?</h2>
            <p class="text-gray-500 mt-2 text-sm">No worries! Enter your email address below, and we'll send you a link
                to reset your password.</p>
        </div>

        <form th:action="@{/forgot-password}" method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <label>
                    <input type="email" name="email" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-neoRed focus:ring-2 focus:ring-red-200 outline-none transition"
                        placeholder="Enter your registered email">
                </label>
            </div>

            <button type="submit"
                class="w-full bg-neoRed text-white font-bold py-3 rounded-lg hover:bg-neoRedHover shadow-lg transition">
                Send Reset Link
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="sign_in.html"
                class="text-gray-600 hover:text-neoRed font-medium text-sm flex items-center justify-center gap-2">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

</body>
