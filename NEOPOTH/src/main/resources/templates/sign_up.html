<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - NeoPoth</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neoRed: '#DC2626',
                        neoRedHover: '#B91C1C',
                        neoDark: '#1F2937',
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen flex bg-white">

    <div class="hidden lg:flex w-1/3 bg-neoDark items-center justify-center relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-gray-900 to-gray-800"></div>
        <div class="z-10 text-center px-8 text-white">
            <h2 class="text-3xl font-bold mb-6">Join the Community</h2>
            <ul class="text-left space-y-4 text-gray-300 mx-auto max-w-xs">
                <li class="flex items-center gap-3"><i class="fas fa-check-circle text-neoRed"></i> Verified Jobs</li>
                <li class="flex items-center gap-3"><i class="fas fa-check-circle text-neoRed"></i> Secure Payments</li>
                <li class="flex items-center gap-3"><i class="fas fa-check-circle text-neoRed"></i> Skill Development
                </li>
            </ul>
        </div>
        <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-80 h-80 bg-neoRed opacity-20 rounded-full blur-3xl"></div>
    </div>

    <div class="w-full lg:w-2/3 flex flex-col justify-center px-6 md:px-20 py-10 relative overflow-y-auto">
        <a href="landing_page.html"
            class="absolute top-6 right-8 text-gray-500 hover:text-neoRed font-medium flex items-center gap-2">
            <i class="fas fa-times"></i> Close
        </a>

        <div class="max-w-lg w-full mx-auto">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-900">Create your account</h1>
                <p class="text-gray-500 mt-2">Already have an account? <a href="sign_in.html"
                        class="text-neoRed font-medium hover:underline">Log in</a></p>
            </div>

            <form th:action="@{/register}" method="post" class="space-y-5">

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="role" value="STUDENT" class="peer sr-only" checked>
                        <div
                            class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-neoRed peer-checked:bg-red-50 transition text-center hover:bg-gray-50">
                            <i class="fas fa-user-graduate text-2xl mb-2 text-gray-500 peer-checked:text-neoRed"></i>
                            <div class="font-semibold text-gray-700 peer-checked:text-neoRed">I am a Student</div>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="role" value="EMPLOYER" class="peer sr-only">
                        <div
                            class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-neoRed peer-checked:bg-red-50 transition text-center hover:bg-gray-50">
                            <i class="fas fa-briefcase text-2xl mb-2 text-gray-500 peer-checked:text-neoRed"></i>
                            <div class="font-semibold text-gray-700 peer-checked:text-neoRed">I am an Employer</div>
                        </div>
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <label>
                            <input type="text" name="fullName" required
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-neoRed focus:ring-2 focus:ring-red-200 outline-none transition">
                        </label>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                        <label>
                            <input type="tel" name="phone"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-neoRed focus:ring-2 focus:ring-red-200 outline-none transition">
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <label>
                        <input type="email" name="email" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-neoRed focus:ring-2 focus:ring-red-200 outline-none transition">
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <label>
                            <input type="password" name="password" required
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-neoRed focus:ring-2 focus:ring-red-200 outline-none transition">
                        </label>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                        <label>
                            <input type="password" name="confirmPassword" required
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-neoRed focus:ring-2 focus:ring-red-200 outline-none transition">
                        </label>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-neoRed text-white font-bold py-3 rounded-lg hover:bg-neoRedHover shadow-lg hover:shadow-xl transition mt-6">
                    Create Account
                </button>
            </form>
        </div>
    </div>

</body>
